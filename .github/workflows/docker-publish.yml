name: Docker

on:
  release:
    types: [published]
  schedule:
    - cron: '17 8 * * *'
      timezone: Europe/Berlin
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published stable release tag. Leave empty to check the maintained release.
        type: string
        default: ''

permissions:
  contents: read

jobs:
  dispatch-release:
    name: Queue the published release on the default branch
    if: github.event_name == 'release' && !github.event.release.prerelease && !github.event.release.draft
    runs-on: ubuntu-26.04
    permissions:
      actions: write
    steps:
      - name: Dispatch the publisher
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          gh workflow run docker-publish.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH" \
            --raw-field "release_tag=$RELEASE_TAG"

  publish:
    name: Publish checked image to GHCR
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    concurrency:
      group: docker-publish
      queue: max
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      TARGET_PLATFORM: linux/amd64
    steps:
      - name: Select published release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RELEASE: ${{ inputs.release_tag }}
          MAINTAINED_RELEASE: ${{ vars.CONTAINER_RELEASE_TAG }}
        shell: bash
        run: |
          valid_tag() {
            [[ "$1" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ && "$1" != latest && "$1" != tagged ]]
          }

          requested="${REQUESTED_RELEASE:-$MAINTAINED_RELEASE}"
          endpoint="repos/$GITHUB_REPOSITORY/releases/latest"
          if [[ -n "$requested" ]]; then
            if ! valid_tag "$requested"; then
              echo '::error::Use a release tag that is valid as a Docker tag and is distinct from latest and tagged.'
              exit 1
            fi
            endpoint="repos/$GITHUB_REPOSITORY/releases/tags/$requested"
          fi

          tag="$(gh api "$endpoint" --jq 'select(.published_at and (.draft | not) and (.prerelease | not)) | .tag_name')"
          if ! valid_tag "$tag"; then
            echo '::error::Choose a published stable GitHub Release with a container-compatible tag.'
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check out publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}
          path: release-source
          persist-credentials: false

      - name: Prepare the tagged build context and source metadata
        id: source
        shell: bash
        run: |
          context="$(mktemp -d "$RUNNER_TEMP/release-context.XXXXXX")"
          # Historical Dockerfiles use COPY . . so include only the tracked release files.
          git -C release-source archive HEAD | tar -x -C "$context"
          epoch="$(git -C release-source show -s --format=%ct HEAD)"
          created="$(git -C release-source show -s --format=%cI HEAD)"
          revision="$(git -C release-source rev-parse HEAD)"
          {
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}"
            echo "context=$context"
            echo "epoch=$epoch"
            echo "created=$created"
            echo "revision=$revision"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Compare release commit and base image digests
        id: bases
        env:
          IMAGE: ${{ steps.source.outputs.image }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_REVISION: ${{ steps.source.outputs.revision }}
          RELEASE_DOCKERFILE: ${{ steps.source.outputs.context }}/Dockerfile
        run: python3 .github/scripts/container-build-inputs.py

      - name: Build and stage image by digest
        id: image
        if: steps.bases.outputs.reusable_digest == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          SOURCE_DATE_EPOCH: ${{ steps.source.outputs.epoch }}
        with:
          context: ${{ steps.source.outputs.context }}
          file: ${{ steps.source.outputs.context }}/Dockerfile
          build-contexts: ${{ steps.bases.outputs.contexts }}
          platforms: ${{ env.TARGET_PLATFORM }}
          pull: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.release.outputs.tag }}
            org.opencontainers.image.created=${{ steps.source.outputs.created }}
            org.opencontainers.image.revision=${{ steps.source.outputs.revision }}
            org.opencontainers.image.base.name=${{ steps.bases.outputs.base_name }}
            org.opencontainers.image.base.digest=${{ steps.bases.outputs.base_digest }}
            de.ddb.labs.ddbapi.build-inputs=${{ steps.bases.outputs.fingerprint }}
          # The checked digest remains stable when the image is rebuilt from the same inputs.
          provenance: false
          outputs: type=image,name=${{ steps.source.outputs.image }},push=true,push-by-digest=true,name-canonical=true,rewrite-timestamp=true
          cache-from: type=gha,scope=ddbapi
          cache-to: type=gha,scope=ddbapi,mode=max

      - name: Pull the exact image to check
        id: candidate
        env:
          IMAGE: ${{ steps.source.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest || steps.bases.outputs.reusable_digest }}
        shell: bash
        run: |
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo '::error::Expected an image SHA-256 digest.'
            exit 1
          fi
          ref="$IMAGE@$DIGEST"
          docker pull --platform "$TARGET_PLATFORM" "$ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Test and scan the release image
        uses: ./.github/actions/check-container
        with:
          image: ${{ steps.candidate.outputs.ref }}
          container-port: '8080'
          http-path: ${{ vars.CONTAINER_HTTP_PATH || '/' }}
          cyclonedx-path: /usr/src/app/sbom.cdx.json
          block-on-fixable: 'true'

      - name: Select tags to update
        id: promotion
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.source.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest || steps.bases.outputs.reusable_digest }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_REVISION: ${{ steps.source.outputs.revision }}
          MAINTAINED_RELEASE: ${{ vars.CONTAINER_RELEASE_TAG }}
        shell: bash
        run: |
          current_source="$(gh api "repos/$GITHUB_REPOSITORY/commits/refs%2Ftags%2F$RELEASE_TAG" --jq '.sha')"
          if [[ "$current_source" != "$RELEASE_REVISION" ]]; then
            echo '::error::The Git tag changed during the run.'
            exit 1
          fi

          # A different release may have become latest while the image was being checked.
          maintained="$MAINTAINED_RELEASE"
          if [[ -z "$maintained" ]]; then
            maintained="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')"
          fi
          tags=("$IMAGE:$RELEASE_TAG")
          if [[ "$RELEASE_TAG" == "$maintained" ]]; then
            tags+=("$IMAGE:latest" "$IMAGE:tagged")
          fi

          changed=()
          for tag in "${tags[@]}"; do
            if ! current="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$tag" 2>&1)"; then
              if [[ "${current,,}" == *"${tag,,}: not found"* || "${current,,}" == *'manifest unknown'* ]]; then
                current=''
              else
                printf '%s\n' "$current" >&2
                exit 1
              fi
            fi
            if [[ "$current" != "$DIGEST" ]]; then
              changed+=("$tag")
            fi
          done

          if (( ${#changed[@]} == 0 )); then
            echo "Deployment tags already reference the checked digest." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo 'tags<<IMAGE_TAGS'
            printf '%s\n' "${changed[@]}"
            echo 'IMAGE_TAGS'
          } >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: steps.promotion.outputs.tags != ''

      - name: Sign the checked digest and update tags
        if: steps.promotion.outputs.tags != ''
        env:
          IMAGE_REF: ${{ steps.candidate.outputs.ref }}
          TAGS: ${{ steps.promotion.outputs.tags }}
        shell: bash
        run: |
          args=()
          while IFS= read -r tag; do
            args+=(--tag "$tag")
          done <<< "$TAGS"
          cosign sign --yes "$IMAGE_REF"
          docker buildx imagetools create --prefer-index=false "${args[@]}" "$IMAGE_REF"
          printf 'Published checked and signed image %s\n' "$IMAGE_REF" >> "$GITHUB_STEP_SUMMARY"
