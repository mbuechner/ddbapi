name: Check HTTP container
description: Check HTTP startup and scan the image and its optional CycloneDX SBOM.

inputs:
  image:
    description: Local image tag or pulled registry digest to check.
    required: true
  container-port:
    description: TCP port used by the HTTP server inside the container.
    default: '8080'
  http-path:
    description: Loopback HTTP path. HTTP 2xx and 3xx responses pass.
    default: '/'
  cyclonedx-path:
    description: Absolute path to an optional CycloneDX JSON SBOM inside the image.
    default: ''
  block-on-fixable:
    description: Fail on High or Critical findings with a fix available.
    default: 'false'

runs:
  using: composite
  steps:
    - name: Check HTTP startup and collect the optional SBOM
      id: smoke
      env:
        IMAGE: ${{ inputs.image }}
        CONTAINER_PORT: ${{ inputs.container-port }}
        HTTP_PATH: ${{ inputs.http-path }}
        CYCLONEDX_PATH: ${{ inputs.cyclonedx-path }}
      shell: bash
      run: |
        if [[ ! "$CONTAINER_PORT" =~ ^[1-9][0-9]{0,4}$ ]] || (( CONTAINER_PORT > 65535 )); then
          echo '::error::container-port must be an integer from 1 to 65535.'
          exit 1
        fi
        if [[ "$HTTP_PATH" != /* || ( -n "$CYCLONEDX_PATH" && "$CYCLONEDX_PATH" != /* ) ]]; then
          echo '::error::http-path and any cyclonedx-path must start with /.'
          exit 1
        fi

        container="$(docker create --pull=never --publish "127.0.0.1::${CONTAINER_PORT}" -- "$IMAGE")"
        cleanup() {
          if [[ $? -ne 0 ]]; then
            docker inspect --format '{{json .State}}' "$container" >&2 || true
            docker logs "$container" >&2 || true
          fi
          docker rm -f "$container" >/dev/null
        }
        trap cleanup EXIT
        docker start "$container" >/dev/null

        address="$(docker port "$container" "${CONTAINER_PORT}/tcp")"
        curl --fail --silent --show-error --globoff --noproxy '*' \
          --retry 25 --retry-all-errors --retry-delay 1 --retry-max-time 30 --max-time 5 \
          --output /dev/null -- "http://${address}${HTTP_PATH}"

        if [[ -n "$CYCLONEDX_PATH" ]]; then
          # Older release images may have been built before the SBOM was included.
          present="$(docker exec "$container" sh -c 'if [ -e "$1" ] || [ -L "$1" ]; then echo present; fi' sh "$CYCLONEDX_PATH")"
          if [[ "$present" == 'present' ]]; then
            sbom="$(mktemp --suffix=.json "$RUNNER_TEMP/container-sbom.XXXXXX")"
            echo "sbom=$sbom" >> "$GITHUB_OUTPUT"
            docker exec "$container" sh -c '[ -f "$1" ] && [ ! -L "$1" ] && cat "$1"' sh "$CYCLONEDX_PATH" > "$sbom"
            if ! jq -e '
              .bomFormat == "CycloneDX" and (.components | type == "array" and length > 0)
            ' "$sbom" >/dev/null; then
              echo '::error::Expected a CycloneDX JSON SBOM with components.'
              exit 1
            fi
          fi
        fi

    - name: Scan image for known vulnerabilities
      id: image-scan
      uses: anchore/scan-action@11983a512817154c80a9db660c1a184be7513ed6 # v7.4.3
      with:
        image: ${{ inputs.image }}
        output-format: json
        fail-build: 'false'
        by-cve: 'true'

    - name: Scan dependencies from the CycloneDX SBOM
      id: sbom-scan
      if: steps.smoke.outputs.sbom != ''
      uses: anchore/scan-action@11983a512817154c80a9db660c1a184be7513ed6 # v7.4.3
      with:
        sbom: ${{ steps.smoke.outputs.sbom }}
        output-format: json
        fail-build: 'false'
        by-cve: 'true'

    - name: Summarize findings and apply release policy
      env:
        IMAGE_SCAN: ${{ steps.image-scan.outputs.json }}
        SBOM_SCAN: ${{ steps.sbom-scan.outputs.json }}
        SBOM: ${{ steps.smoke.outputs.sbom }}
        BLOCK_ON_FIXABLE: ${{ inputs.block-on-fixable }}
      shell: bash
      run: |
        scans=("$IMAGE_SCAN")
        if [[ -n "$SBOM" ]]; then
          scans+=("$SBOM_SCAN")
        fi
        for result in "${scans[@]}"; do
          jq -e '.matches | type == "array"' "$result" >/dev/null
        done
        findings="$(jq --slurp '
          [.[].matches[] | select(.vulnerability.severity == "High" or .vulnerability.severity == "Critical")]
          | unique_by(.vulnerability.id, .artifact.type, .artifact.name, .artifact.version, .vulnerability.namespace, .vulnerability.fix.state)
        ' "${scans[@]}")"
        fixable="$(jq '[.[] | select(.vulnerability.fix.state == "fixed")] | length' <<< "$findings")"
        {
          echo '### High and Critical vulnerabilities'
          echo
          echo '| Advisory | Package | Installed | Source | Severity | Fixed versions |'
          echo '| --- | --- | --- | --- | --- | --- |'
          jq -r '.[] | "| \(.vulnerability.id) | \(.artifact.name) | \(.artifact.version) | \(.artifact.type) | \(.vulnerability.severity) | \((.vulnerability.fix.versions // []) | join(", ")) |"' <<< "$findings"
          echo
          echo "Findings with a fix available: $fixable"
        } >> "$GITHUB_STEP_SUMMARY"
        if [[ "$BLOCK_ON_FIXABLE" == 'true' && "$fixable" -gt 0 ]]; then
          echo '::error::Fixable High or Critical vulnerabilities block publication. See the job summary.'
          exit 1
        fi

    - name: Remove the extracted SBOM
      if: always() && steps.smoke.outputs.sbom != ''
      env:
        SBOM: ${{ steps.smoke.outputs.sbom }}
      shell: bash
      run: rm -f -- "$SBOM"
